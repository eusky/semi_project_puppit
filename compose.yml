services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: puppit
      MYSQL_USER: puppit
      MYSQL_PASSWORD: puppit_dev_password
      MYSQL_ROOT_PASSWORD: puppit_dev_root_password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./src/main/resources/SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ops/mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./ops/mysql/03-demo-users.sql:/docker-entrypoint-initdb.d/03-demo-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT COUNT(*) FROM product_status' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_dev_data:
